<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<text x="150" y="24" font-size="15" font-weight="600" fill="#7d8590">Poll-cycle latency — before vs. after the SQLite/HTTP fix</text>
<line x1="150.0" y1="48" x2="150.0" y2="208.0" stroke="rgba(125,133,144,0.18)" stroke-width="1"/>
<text x="150.0" y="226.0" text-anchor="middle" font-size="12" fill="#7d8590">10s</text>
<line x1="313.4" y1="48" x2="313.4" y2="208.0" stroke="rgba(125,133,144,0.18)" stroke-width="1"/>
<text x="313.4" y="226.0" text-anchor="middle" font-size="12" fill="#7d8590">1m</text>
<line x1="523.3" y1="48" x2="523.3" y2="208.0" stroke="rgba(125,133,144,0.18)" stroke-width="1"/>
<text x="523.3" y="226.0" text-anchor="middle" font-size="12" fill="#7d8590">10m</text>
<line x1="670.0" y1="48" x2="670.0" y2="208.0" stroke="rgba(125,133,144,0.18)" stroke-width="1"/>
<text x="670.0" y="226.0" text-anchor="middle" font-size="12" fill="#7d8590">50m</text>
<rect x="150" y="54" width="487.5" height="52" rx="5" fill="#d98a3d"/>
<text x="136" y="85.0" text-anchor="end" font-size="14" font-weight="600" fill="#7d8590">Before fix</text>
<text x="647.5" y="85.0" font-size="15" font-weight="700" fill="#d98a3d">~30–40 min</text>
<rect x="150" y="150" width="170.6" height="52" rx="5" fill="#2da36f"/>
<text x="136" y="181.0" text-anchor="end" font-size="14" font-weight="600" fill="#7d8590">After fix</text>
<text x="330.6" y="181.0" font-size="15" font-weight="700" fill="#2da36f">~65 s</text>
<text x="670" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#2da36f">≈ 32× faster</text>
<text x="150" y="286" font-size="12" fill="#7d8590">log scale · non-sargable query full-scanning 9.3M rows + ~98 serial HTTP calls per iteration, fixed</text>
</svg>